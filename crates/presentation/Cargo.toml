[package]
name = "senkai-presentation"
version = "0.1.0"
edition = "2024"
description = "Presentation layer (CLI + TUI) for senkai"
license = "MIT"
homepage = "https://codeberg.org/gbrennon/senkai"
repository = "https://codeberg.org/gbrennon/senkai"

[lib]
path = "src/lib.rs"
readme = "../../README.md"

[dependencies]
senkai-core = { path = "../core", version = "0.1.0" }

clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
fuzzy-matcher = "0.3"
throbber-widgets-tui = "0.11.1"

[dev-dependencies]
tempfile = "3.0"

