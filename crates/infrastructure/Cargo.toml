[package]
name = "senkai-infrastructure"
version = "0.1.0"
edition = "2024"
description = "Infrastructure adapters for senkai"
license = "MIT"
homepage = "https://codeberg.org/gbrennon/senkai"
repository = "https://codeberg.org/gbrennon/senkai"
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[dependencies]
senkai-core = { path = "../core", version = "0.1.0" }
toml = "0.8"

[dev-dependencies]
libc = "0.2"
tempfile = "3.0"

[[test]]
name = "settings_repository"
path = "tests/settings_repository_test.rs"
