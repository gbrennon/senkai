[package]
name = "senkai"
version = "0.1.0"
edition = "2024"
description = "A version-control and terminal-multiplexing workspace manager"
readme = "README.md"
homepage = "https://codeberg.org/gbrennon/senkai"
license = "MIT"
repository = "https://codeberg.org/gbrennon/senkai"
keywords = ["tmux", "git", "worktree", "terminal", "plugin"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "senkai"
path = "src/lib.rs"

[[bin]]
name = "sk"
path = "src/main.rs"

[[test]]
name = "app"
path = "tests/app_test.rs"
[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/infrastructure",
    "crates/presentation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[dependencies]
senkai-core = { path = "crates/core", version = "0.1.0" }
senkai-presentation = { path = "crates/presentation", version = "0.1.0" }
senkai-infrastructure = { path = "crates/infrastructure", version = "0.1.0" }


[dev-dependencies]
tempfile = "3.0"
libc = "0.2"

[profile.release]
lto = true

[profile.dev]
opt-level = 1
